; PlatformIO version of the sweep example, for projects installing Servo from
; the PlatformIO registry rather than vendoring the source.
;
; This is a complete, standalone project: copy the directory anywhere and it
; builds. Nothing here is special to living inside the library repository, and
; PlatformIO does not resolve Servo from the enclosing directory -- the
; lib_deps line below is what supplies it, exactly as it would in your project.

[env:genericCH32V003F4P6]
; The CH32V platform is community-maintained and is not in the PlatformIO
; registry, so it has to be given by URL. "platform = ch32v" only resolves on a
; machine where it already happens to be installed.
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board = genericCH32V003F4P6
framework = ch32v003fun

; The registry owner is the PlatformIO account name, which is not the same as
; the GitHub organisation the source lives in.
lib_deps = fyfar/Servo

; Configuration knobs go here rather than in funconfig.h when you prefer them
; in one place, e.g.:
;   build_flags = -DSERVO_USE_SYSTICK=1 -DSERVO_SMOOTH=1
