name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tim2-examples:
    # TIM2 backend is CH32V003-only (Servo.h #errors on every other target),
    # so these three examples never need a matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install RISC-V toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-riscv64-unknown-elf libnewlib-dev

      - name: Build
        run: |
          set -e
          for dir in servo_sweep servo_multi servo_smooth; do
            echo "== $dir =="
            make -C "examples/$dir" "$dir.elf"
          done

  systick-backend:
    # One build per genuinely distinct compiled shape, not per chip: Servo.h's
    # portability block is a single #if covering every family (no per-family
    # branch), so CH32V002/004-007 compile identically (rv32ec_zmmul) and so do
    # CH32X03x/CH32L103/CH32V20x (rv32imac, ilp32, no family-specific code).
    # CH32V003 (rv32ec, no zmmul), CH32V10x (the one family with an actual
    # #if defined(CH32V10x) branch in Servo.cpp) and CH32V30x (the only float
    # ABI, rv32imafc) are each their own shape.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcu:
          - CH32V003
          - CH32V002
          - CH32V10x
          - CH32X03x
          - CH32V30x
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install RISC-V toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-riscv64-unknown-elf libnewlib-dev

      - name: Build
        run: make -C examples/servo_systick TARGET_MCU=${{ matrix.mcu }} servo_systick.elf
